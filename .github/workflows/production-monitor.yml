name: Food My Way production monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: food-my-way-production-monitor
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production
        id: verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs https://foodmyway.app

      - name: Open or update production incident
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] Food My Way production verification failed';
            const marker = '<!-- food-my-way-production-monitor -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe hourly production verifier failed. Review the [workflow run](${runUrl}) and follow \`OPERATIONS_RUNBOOK.md\`.\n\nDetected: ${new Date().toISOString()}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: []
              });
            }

      - name: Fail the workflow after incident handling
        if: steps.verify.outcome == 'failure'
        run: exit 1
